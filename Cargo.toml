[package]
name = "union-package-manager"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "upm"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive"] }
colored = { version = "3.0.0"}
crc = "3.4.0"
deb822-lossless = { version = "0.4.0", features = ["deb822-fast"] }
flate2 = "1.1.5"
futures = "0.3.31"
indicatif = { version = "0.18.3", features = ["futures", "tokio", "unicode-segmentation"] }
md5 = "0.8.0"
reqwest = { version = "0.12.24", features = ["json"] }
sequoia-openpgp = "2.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_toml = "0.0.1"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
uuid = { version = "1.19.0", features = ["v4"] }
